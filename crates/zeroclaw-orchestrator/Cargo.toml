[package]
name = "zeroclaw-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Owns the shared conversation ledger: drives rounds, judges contributions, and is the sole writer."
publish = false

[dependencies]
zeroclaw-ledger.workspace = true
zeroclaw-ledger-store.workspace = true
zeroclaw-spawn.workspace = true

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = "2.0"
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1.0"
uuid = { version = "1.22", default-features = false, features = ["v4", "std", "serde"] }

[dev-dependencies]
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
# The Postgres smoke test drives the real store end to end.
zeroclaw-ledger-store = { workspace = true }
